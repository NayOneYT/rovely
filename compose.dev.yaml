name: rovely

services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rovely_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rovely
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: backend-dev
    image: nayoneyt/rovely-backend:latest
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: frontend-dev
    image: nayoneyt/rovely-frontend:latest
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - /app/node_modules

volumes:
  pgdata:
  redis_data:
